<script>
addEventListener('DOMContentLoaded', () => {
const POLL = 15000;   // matches the 15 s CDN cache on /api/flights: faster polling only re-downloads the same data
const map = L.map('map', {zoomControl: false, worldCopyJump: true}).setView([22.5, 79], 5);
L.control.zoom({position: 'bottomright'}).addTo(map);
// Base map: OpenFreeMap vector tiles (free, no key, OpenStreetMap data), restyled to the BlackRhino palette.
// Country/state boundary layers are hidden: a flight tracker doesn't need them and Indian law requires official boundaries.
fetch('https://tiles.openfreemap.org/styles/dark').then(r => r.json()).then(st => {
  for (const l of st.layers) {
    const id = l.id, p = l.paint = l.paint || {};
    if (id.startsWith('boundary') || id.startsWith('road_oneway')) { (l.layout = l.layout || {}).visibility = 'none'; continue; }
    if (l.type === 'background') p['background-color'] = '#020406';
    else if (id === 'water') p['fill-color'] = '#06111c';
    else if (l.type === 'fill') { p['fill-color'] = id.startsWith('aeroway') ? '#101a24' : '#070c11'; p['fill-opacity'] = id.startsWith('aeroway') ? 0.9 : 0.6; }
    else if (id.startsWith('aeroway')) p['line-color'] = id.includes('runway') ? '#2a3c4e' : '#16222d';
    else if (l.type === 'line') { p['line-color'] = id === 'waterway' ? '#0a1a29' : '#111a23'; }
    else if (l.type === 'symbol') {
      p['text-color'] = id.startsWith('place_city') || id.startsWith('place_country') ? '#8a98a6' : id === 'water_name' ? '#2b4a66' : '#56636f';
      p['text-halo-color'] = '#020406'; p['text-halo-width'] = 1.2;
      if (l.layout && l.layout['text-field'] && /^(place|water_name)/.test(id)) l.layout['text-field'] = ['coalesce', ['get', 'name:en'], ['get', 'name_en'], ['get', 'name:latin'], ['get', 'name']];
    }
  }
  L.maplibreGL({style: st, attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · data: adsb.fi, adsb.lol, OpenSky, adsbdb · <a href="/credits">credits</a> · <a href="/privacy">privacy</a>'}).addTo(map);
}).catch(() => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {className: 'br-base', attribution: 'Tiles &copy; Esri', maxZoom: 16}).addTo(map));

// All planes + trails are drawn on ONE canvas (no per-plane DOM nodes).
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
const PLANE = new Path2D('M12 2c.8 0 1.3.9 1.3 2v5.2l7.7 4.6v2l-7.7-2.4v4.8l2.3 1.7V21L12 20l-3.6 1v-1.1l2.3-1.7v-4.8L3 15.8v-2l7.7-4.6V4c0-1.1.5-2 1.3-2z');
// silhouettes by aircraft class (24x24 box, nose up): jet (PLANE), straight-wing prop, helicopter
const PROP = new Path2D('M12 2.5c.7 0 1.1.7 1.1 1.6V9h8.2v2.3l-8.2.9v6.1l2.7 1.6V21L12 20.3 8.2 21v-1.1l2.7-1.6v-6.1l-8.2-.9V9h8.2V4.1c0-.9.4-1.6 1.1-1.6z');
const HELI = new Path2D('M12 5.2a3.4 4.4 0 1 1 0 8.8a3.4 4.4 0 1 1 0-8.8zM11.2 13.6h1.6v7h2.4v1.4H8.8v-1.4h2.4zM3 3.4l.9-.9 16.9 16.9-.9.9zM20.1 2.5l.9.9L4.1 20.3l-.9-.9z');
const HELI_T = /^(EC[0-9]|H1[2-7]|H160|AS[3-5]|AW1|A1[0-9]9|B0[6-7]|B4[0-3]|B2|R22|R44|R66|S76|S92|MI[0-9]|ALH|LCH|BK17|EH10|NH90)/;
const PROP_T = /^(AT[4-7]|DH8|DHC|B190|BE[2-9]0|C208|C212|D228|DO2|PC1[2-2]|PC6|SF34|JS3|E120|L410|AN2|AN3|C130|C30J|P180|SW4|F27|F50)/;
const WIDE_T = /^(A30|A31|A33|A34|A35|A38|B74|B76|B77|B78|MD11|IL76|C17|A400|KC10|KC46)/;
const LIGHT_T = /^(C1[5-9]|C17[0-9]|C182|C206|C210|P28|PA[0-9]|DA[2-6]|SR2|TB[0-9]|C42|ZLIN|TECN|P2008|M20)/;
function shapeOf(d) {
  if (d._sh) return d._sh;
  const t = String(d.type || '').toUpperCase(), c = d.category;
  return d._sh = c === 'A7' || HELI_T.test(t) ? [HELI, 0.9] : PROP_T.test(t) ? [PROP, 0.95] : c === 'A1' || LIGHT_T.test(t) ? [PROP, 0.72]
    : c === 'A5' || WIDE_T.test(t) ? [PLANE, 1.25] : [PLANE, 1];
}
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; dirty = true;
}
addEventListener('resize', resize);

const planes = new Map();   // hex -> {d, pts, err, lat, lon, x, y}
let view = planes, replay = null;   // replay: {t, playing, speed} while scrubbing history
let selected = null, lastFetch = 0, serverOffset = 0, dirty = true, moving = false, zooming = false;
resize();

// calm ramp: deep blue low, pale sky high; only the selected plane is pure white
const STOPS = [[0,'#2c6fb8'],[10000,'#3f8fd6'],[20000,'#64b0ec'],[30000,'#8fcaf6'],[40000,'#cfe9fb']];
function altColor(alt, ground) {
  if (ground || alt == null) return '#4b5866';
  for (let i = STOPS.length - 1; i >= 0; i--) if (alt >= STOPS[i][0]) return STOPS[i][1];
  return '#2c6fb8';
}

// Dead reckoning: move from last fix along track at ground speed.
const R = 6371000;
function project(lat, lon, trackDeg, gsKt, dt) {
  const d = gsKt * 0.514444 * dt / R, b = trackDeg * Math.PI / 180, p1 = lat * Math.PI / 180, l1 = lon * Math.PI / 180;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(p1), Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [p2 * 180 / Math.PI, ((l2 * 180 / Math.PI) + 540) % 360 - 180];
}
const nowS = () => Date.now() / 1000 + serverOffset;

let inflight = false;
async function poll(first) {
  if ((document.hidden && !first) || inflight) return;   // no work while tab is hidden
  inflight = true;
  const c = map.getCenter();
  try {
    const j = first || await fetch('/api/flights', {headers: {'X-Center': `${c.lat.toFixed(3)},${c.lng.toFixed(3)}`}}).then(r => r.json());
    if (!j) throw 0;
    serverOffset = j.now - Date.now() / 1000;
    lastFetch = Date.now();
    FT.ingest(j);
    ingest(j.ac);
    record(j);
    if (wantSel && planes.has(wantSel)) { const h = wantSel; wantSel = null; select(h); }
    const m = j.meta;
    document.getElementById('src').innerHTML =
      `${m.adsbfi ? `adsb.fi: ${m.adsbfi}${m.opensky ? `<br>OpenSky: ${m.opensky}` : ''}` : `OpenSky: ${m.opensky}${m.opensky_age != null ? ` (${m.opensky_age}s ago)` : ''}${m.quota ? ` · quota ${m.quota}` : ''}`}<br>adsb.lol: ${m.adsblol}<br>routes: ${m.routes || '-'} · ${FT.lookupStatus()}<br>positions between fixes are dead-reckoned`;
  } catch (e) {
    document.getElementById('src').textContent = 'server unreachable, retrying…';
  }
  inflight = false;
}

function ingest(list, partial) {
  const seen = new Set(), t = nowS();
  for (const d of list) {
    FT.attach(d);
    seen.add(d.hex);
    let p = planes.get(d.hex);
    if (!p) { p = {pts: [], err: null}; planes.set(d.hex, p); }
    else if (d.ts > p.d.ts && p.lat != null) {
      if (p.est) { p.est = false; p.dv = null; }   // real signal is back
      // Fresh fix: blend from where the plane is drawn to avoid a jump.
      p.err = {lat: p.lat - d.lat, lon: p.lon - d.lon, t: performance.now()};
    } else if (d.ts <= p.d.ts) continue;
    p.d = d; p.col = altColor(d.alt, d.ground);
    p.pts.push([d.lat, d.lon, d.ground ? null : d.alt]); if (p.pts.length > 120) p.pts.shift();
  }
  if (!partial) for (const [hex, p] of planes)
    if (!seen.has(hex) && t - p.d.ts > 90 && !FT.keepGhost(p, t)) { planes.delete(hex); if (selected === hex) select(null); }
  document.getElementById('nAll').textContent = planes.size;
  checkAlerts();
  dirty = true;
  if (selected) renderInfo();
}

// Adaptive frame rate: at country zoom a plane moves < 1 px/s, so redraw rarely.
const fpsFor = z => moving || selected ? 60 : z >= 9 ? 60 : z >= 7 ? 24 : 8;
let lastDraw = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (zooming) return;
  if (!dirty && ts - lastDraw < 1000 / fpsFor(map.getZoom())) return;
  lastDraw = ts; dirty = false;
  draw();
}

function draw() {
  const t = replay ? replay.t : nowS(), z = map.getZoom(), showTrails = document.getElementById('trails').checked;
  const sz = z >= 10 ? 28 : z >= 9 ? 25 : z >= 8 ? 22 : z >= 7 ? 20 : z >= 6 ? 17 : 15;   // calm at country zoom, rich close in
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawAirports(z);
  const sel0 = !replay && selected && planes.get(selected);
  if (sel0) drawRoute(sel0);
  let inView = 0;
  for (const p of view.values()) {
    p.dv = p.est ? FT.virtual(p.d, t) : null;   // silent near destination: modelled approach
    const d = p.dv || p.d;
    const dt = Math.min(Math.max(t - d.ts, 0), 180);   // cap extrapolation at 3 min
    let [lat, lon] = d.ground || d.gs < 30 ? [d.lat, d.lon] : project(d.lat, d.lon, d.track, d.gs, dt);
    if (p.err) {   // ease correction over 2s
      const k = Math.max(0, 1 - (performance.now() - p.err.t) / 2000);
      lat += p.err.lat * k; lon += p.err.lon * k;
      if (k === 0) p.err = null;
    }
    p.lat = lat; p.lon = lon;
    const pt = map.latLngToContainerPoint([lat, lon]);
    p.x = pt.x; p.y = pt.y;
    if (pt.x < -40 || pt.y < -40 || pt.x > W + 40 || pt.y > H + 40 || (!FT.onMap(d) && selected !== d.hex)) { p.vis = false; continue; }
    p.vis = true; inView++;
    if (showTrails && (z >= 7 || selected === d.hex) && p.pts.length) {
      ctx.globalAlpha = selected === d.hex ? .9 : .5; ctx.lineWidth = selected === d.hex ? 2 : 1.5;
      let col = null, prev = null;
      for (const q of p.pts) {   // colour by the altitude at each fix; one stroke per run of the same colour
        const a = map.latLngToContainerPoint(q), c = altColor(q[2], q[2] == null);
        if (c !== col) { if (col) ctx.stroke(); ctx.strokeStyle = col = c; ctx.beginPath(); if (prev) ctx.moveTo(prev.x, prev.y); }
        ctx.lineTo(a.x, a.y); prev = a;
      }
      if (col) { ctx.lineTo(pt.x, pt.y); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  }
  // planes on top of trails; selected last
  const sel = !replay && selected && planes.get(selected);
  const ap = FT.aptSel;
  for (const p of view.values()) if (p.vis && p !== sel) drawPlane(p, sz, ap && (p.d.o === ap || p.d.d === ap) && p.d.rv !== false ? 'apt' : false);
  if (sel && sel.vis) {   // selected: soft sky halo, then the plane in white
    ctx.beginPath(); ctx.arc(sel.x, sel.y, sz * .95, 0, 7); ctx.fillStyle = 'rgba(124,200,255,.16)'; ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(124,200,255,.55)'; ctx.stroke();
    drawPlane(sel, sz + 6, true);
  }
  if (replay && z >= 8) drawLabels(view);
  document.getElementById('nView').textContent = inView;
  if (sel && document.getElementById('follow')?.checked) map.panTo([sel.lat, sel.lon], {animate: false});
}
// ---- airports (drawn on the same canvas, under the planes) ----
function drawAirports(z) {
  const showRwy = z >= 9;
  for (const a of FT.airports) {
    const big = a.type === 'large';
    if (!big && z < (a.type === 'medium' ? 6 : 7)) continue;
    const pt = map.latLngToContainerPoint([a.lat, a.lon]);
    if (pt.x < -50 || pt.y < -50 || pt.x > W + 50 || pt.y > H + 50) { a._vis = false; continue; }
    a._vis = true; a._x = pt.x; a._y = pt.y;
    const sel = FT.aptSel === a.icao;
    if (showRwy) for (const r of a.runways) {
      const p1 = map.latLngToContainerPoint([r.pts[0], r.pts[1]]), p2 = map.latLngToContainerPoint([r.pts[2], r.pts[3]]);
      ctx.strokeStyle = '#4b5568'; ctx.lineWidth = Math.max(2, 2 ** (z - 13) * 6); ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    }
    const r = big ? 4.5 : 3;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, sel ? 7 : r, 0, 7);
    ctx.fillStyle = sel ? '#7cc8ff' : big ? '#cbd5e1' : '#8592a8'; ctx.fill();
    ctx.lineWidth = sel ? 2 : 1; ctx.strokeStyle = sel ? '#fff' : '#0b0f17'; ctx.stroke();
    if (z >= (big ? 5 : 8) || sel) {
      ctx.font = `${sel ? 700 : 600} ${sel ? 13 : 11}px ui-sans-serif,sans-serif`;
      ctx.lineWidth = 3; ctx.strokeStyle = '#0b0f17'; ctx.fillStyle = sel ? '#7cc8ff' : '#cbd5e1';
      const t = a.iata || a.icao;
      ctx.strokeText(t, pt.x + 7, pt.y - 6); ctx.fillText(t, pt.x + 7, pt.y - 6);
    }
  }
}
// great-circle path origin -> aircraft (solid) -> destination (dashed)
function gcPts(a, b, n = 48) {
  const r = Math.PI / 180, [la1, lo1, la2, lo2] = [a[0] * r, a[1] * r, b[0] * r, b[1] * r];
  const dd = FT.km(a[0], a[1], b[0], b[1]) / 6371, out = [];
  if (dd < 1e-6) return [a, b];
  for (let i = 0; i <= n; i++) {
    const f = i / n, A = Math.sin((1 - f) * dd) / Math.sin(dd), B = Math.sin(f * dd) / Math.sin(dd);
    const x = A * Math.cos(la1) * Math.cos(lo1) + B * Math.cos(la2) * Math.cos(lo2);
    const y = A * Math.cos(la1) * Math.sin(lo1) + B * Math.cos(la2) * Math.sin(lo2);
    const zz = A * Math.sin(la1) + B * Math.sin(la2);
    out.push([Math.atan2(zz, Math.hypot(x, y)) / r, Math.atan2(y, x) / r]);
  }
  return out;
}
function drawRoute(p) {
  const o = FT.apt(p.d.o), t = FT.apt(p.d.d);
  if (!o || !t || p.d.rv === false || p.lat == null) return;
  const line = (pts, dash) => {
    ctx.setLineDash(dash); ctx.beginPath();
    for (const q of pts) { const a = map.latLngToContainerPoint(q); ctx.lineTo(a.x, a.y); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  ctx.lineWidth = 2; ctx.globalAlpha = .85;
  ctx.strokeStyle = '#7cc8ff'; line(gcPts([o.lat, o.lon], [p.lat, p.lon]), []);
  ctx.strokeStyle = '#e6ebf5'; line(gcPts([p.lat, p.lon], [t.lat, t.lon]), [6, 6]);
  ctx.globalAlpha = 1;
  for (const a of [o, t]) {   // foreign endpoints are not in the Indian list, mark them too
    const pt = map.latLngToContainerPoint([a.lat, a.lon]);
    ctx.beginPath(); ctx.arc(pt.x, pt.y, 5, 0, 7); ctx.fillStyle = '#7cc8ff'; ctx.fill();
    ctx.font = '700 12px ui-sans-serif,sans-serif'; ctx.lineWidth = 3; ctx.strokeStyle = '#0b0f17';
    ctx.strokeText(a.iata || a.icao, pt.x + 7, pt.y + 14); ctx.fillStyle = '#7cc8ff'; ctx.fillText(a.iata || a.icao, pt.x + 7, pt.y + 14);
  }
}

function drawPlane(p, s, isSel) {
  const [SH, f] = shapeOf(p.d), k = s * f / 24;
  if (EMG[p.d.squawk] || (p.d.emergency && p.d.emergency !== 'none')) {   // pulsing beacon ring
    const ph = (performance.now() % 1400) / 1400;
    ctx.beginPath(); ctx.arc(p.x, p.y, s * (.7 + ph * .6), 0, 7); ctx.strokeStyle = `rgba(255,59,47,${1 - ph})`; ctx.lineWidth = 2; ctx.stroke(); dirty = true;
  }
  ctx.setTransform(DPR * k, 0, 0, DPR * k, 0, 0);
  ctx.translate(p.x / k, p.y / k); ctx.rotate((p.dv || p.d).track * Math.PI / 180); ctx.translate(-12, -12);
  if (p.est) {   // estimated, not live: hollow outline with a dashed edge
    ctx.globalAlpha = .95; ctx.fillStyle = 'rgba(3,4,5,.6)'; ctx.fill(SH);
    ctx.lineWidth = isSel ? 2 : 1.5; ctx.strokeStyle = isSel ? '#fff' : '#7cc8ff'; ctx.setLineDash([2.6, 1.8]); ctx.stroke(SH); ctx.setLineDash([]);
  } else {
    ctx.fillStyle = isSel === true ? '#ffffff' : p.col; ctx.fill(SH);
    ctx.lineWidth = isSel === 'apt' ? 1.6 : isSel ? 1.4 : .7; ctx.strokeStyle = isSel === 'apt' ? '#7cc8ff' : isSel ? '#020304' : 'rgba(0,0,0,.75)'; ctx.stroke(SH);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.globalAlpha = 1;
}

map.on('movestart', () => moving = true);
map.on('move', () => dirty = true);
map.on('moveend', () => { moving = false; dirty = true; if (Date.now() - lastFetch > 4000) poll(); });
map.on('zoomstart', () => { zooming = true; cv.style.opacity = 0; });
map.on('zoomend', () => { zooming = false; dirty = true; cv.style.opacity = 1; });
map.on('click', e => {   // hit-test on canvas
  let best = null, bd = FT.touch ? 26 * 26 : 16 * 16;
  if (!replay) for (const [hex, p] of planes) if (p.vis) {
    const dx = p.x - e.containerPoint.x, dy = p.y - e.containerPoint.y, dd = dx * dx + dy * dy;
    if (dd < bd) { bd = dd; best = hex; }
  }
  if (best) return select(best);
  let ba = null, bda = FT.touch ? 22 * 22 : 12 * 12;
  for (const a of FT.airports) if (a._vis) {
    const dx = a._x - e.containerPoint.x, dy = a._y - e.containerPoint.y, dd = dx * dx + dy * dy;
    if (dd < bda) { bda = dd; ba = a; }
  }
  if (ba) FT.openAirport(ba.icao); else select(null);
});
map.getContainer().addEventListener('mousemove', e => {
  let hit = false;
  for (const p of view.values()) if (p.vis && Math.abs(p.x - e.clientX) < 10 && Math.abs(p.y - e.clientY) < 10) { hit = true; break; }
  if (!hit) for (const a of FT.airports) if (a._vis && Math.abs(a._x - e.clientX) < 9 && Math.abs(a._y - e.clientY) < 9) { hit = true; break; }
  map.getContainer().style.cursor = hit ? 'pointer' : '';
});

function select(hex) {
  selected = hex; dirty = true; if (typeof syncUrl === 'function') syncUrl();
  FT.selectFlight(hex, hex && planes.get(hex));
  const box = document.getElementById('info');
  if (!hex) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  renderInfo();
}
function renderInfo() {
  const p = planes.get(selected); if (!p) return;
  const f = document.getElementById('follow')?.checked, sc = document.getElementById('info').scrollTop;
  document.getElementById('infoBody').innerHTML = FT.flightHTML(p, nowS()).replace('<!--acts-end-->',
    `<label class="${f ? 'on' : ''}" title="Keep the map centred on this flight (F)"><input type="checkbox" id="follow" ${f ? 'checked' : ''} hidden>Follow</label>`);
  document.getElementById('info').scrollTop = sc;
}
document.getElementById('close').onclick = () => select(null);
document.getElementById('info').addEventListener('change', e => { if (e.target.id === 'follow') e.target.parentNode.classList.toggle('on', e.target.checked); });
document.getElementById('trails').onchange = () => dirty = true;
setInterval(() => {
  if (document.hidden) return;
  if (selected && planes.get(selected)) FT.checkEstimate(planes.get(selected), nowS(), true);
  if (selected) renderInfo();
  document.getElementById('age').textContent = lastFetch ? Math.round((Date.now() - lastFetch) / 1000) + 's' : '-';
}, 1000);

document.getElementById('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const r = FT.search(e.target.value);
  if (r && r.hex) { const p = planes.get(r.hex); focus([p.lat ?? p.d.lat, p.lon ?? p.d.lon], 8); select(r.hex); return; }
  if (r && r.icao) { FT.openAirport(r.icao); return; }
  e.target.style.borderColor = '#ef4444'; setTimeout(() => e.target.style.borderColor = '', 800);
});

// on phones the bottom sheet covers the lower half: keep the target in the visible top part
function focus(ll, z) {
  map.setView(ll, Math.max(map.getZoom(), z), {animate: false});
  if (innerWidth <= 700) map.panBy([0, innerHeight * 0.27], {animate: false});
}
FT.init({
  planes: () => planes,
  selectFlight: hex => { const p = planes.get(hex); if (!p) return; focus([p.lat ?? p.d.lat, p.lon ?? p.d.lon], 8); select(hex); },
  focusAirport: a => { if (a) focus([a.lat, a.lon], 9); },
  airportChanged: () => dirty = true,
  refreshInfo: () => renderInfo(),
  addFlights: list => ingest(list, true),
  refilter: () => dirty = true,
  layer: (name, on) => setLayer(name, on),
  showTrack: pts => showTrack(pts),
}).then(() => dirty = true);

// ---- map layers: satellite clouds (EUMETSAT WMS), ATC boundaries (FIRs), recorded flight paths
const layers = {};
function setLayer(name, on) {
  if (layers[name]) { map.removeLayer(layers[name]); delete layers[name]; }
  if (!on) return;
  if (name === 'clouds') {
    layers.clouds = L.tileLayer.wms(FT.CLOUD_WMS.url, {layers: FT.CLOUD_WMS.layers, format: 'image/png', transparent: true,
      opacity: 0.45, className: 'cloud-layer', attribution: 'Clouds: EUMETSAT Meteosat'}).addTo(map);
    setInterval(() => layers.clouds && layers.clouds.setParams({_t: Math.floor(Date.now() / 9e5)}), 9e5);   // refresh every 15 min
  } else if (name === 'fir') {
    FT.firData().then(fc => {
      if (layers.fir) return;
      layers.fir = L.geoJSON(fc, {style: {color: '#7dd3fc', weight: 1.3, dashArray: '6 5', fill: false, opacity: .8},
        onEachFeature: (f, l) => l.bindTooltip(f.properties.name, {permanent: true, direction: 'center', className: 'fir-label'})}).addTo(map);
    });
  }
}
let trackLayer = null;
function showTrack(pts) {
  if (trackLayer) { map.removeLayer(trackLayer); trackLayer = null; }
  if (!pts || pts.length < 2) return;
  trackLayer = L.polyline(pts.map(p => [p[1], p[2]]), {color: '#f472b6', weight: 3, opacity: .9}).addTo(map);
  map.fitBounds(trackLayer.getBounds(), {padding: [40, 40]});
}

// ---- squawk alerts: 7500 hijack, 7600 radio failure, 7700 emergency (or an ADS-B emergency status)
const EMG = {'7500': 'hijack', '7600': 'radio failure', '7700': 'emergency'};
const dismissed = new Set(), esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
function checkAlerts() {
  const box = document.getElementById('alert'), rows = [];
  for (const [hex, p] of planes) {
    const d = p.d, why = EMG[d.squawk] || (d.emergency && d.emergency !== 'none' ? String(d.emergency).replace(/[^a-z_]/gi, '') : '');
    if (why && !dismissed.has(hex + d.squawk)) rows.push(`<div class="a" data-hex="${hex}"><b>●</b>${esc(d.flight || hex)} · SQUAWK ${esc(d.squawk || '-')} · ${esc(why)}<i data-x="${hex + d.squawk}" title="dismiss">✕</i></div>`);
  }
  box.innerHTML = rows.slice(0, 4).join('');
  box.style.display = rows.length ? 'flex' : 'none';
}
document.getElementById('alert').addEventListener('click', e => {
  const x = e.target.closest('[data-x]');
  if (x) { dismissed.add(x.dataset.x); return checkAlerts(); }
  const a = e.target.closest('[data-hex]');
  if (a) { const p = planes.get(a.dataset.hex); if (p) { exitReplay(); focus([p.lat ?? p.d.lat, p.lon ?? p.d.lon], 8); select(a.dataset.hex); } }
});

// ---- shareable URL: ?ll=lat,lon,zoom&sel=hex is kept in sync (replaceState, no history spam)
const urlq = new URLSearchParams(location.search);
{
  const ll = (urlq.get('ll') || '').split(',').map(Number);
  if (ll.length === 3 && ll.every(Number.isFinite) && Math.abs(ll[0]) <= 90 && Math.abs(ll[1]) <= 180) map.setView([ll[0], ll[1]], Math.min(Math.max(ll[2], 3), 16), {animate: false});
}
let wantSel = /^~?[0-9a-f]{6}$/.test(urlq.get('sel') || '') ? urlq.get('sel') : null;
function syncUrl() {
  const q = new URLSearchParams(location.search), c = map.getCenter();
  q.set('ll', `${c.lat.toFixed(4)},${c.lng.toFixed(4)},${map.getZoom()}`);
  if (selected) q.set('sel', selected); else q.delete('sel');
  history.replaceState(null, '', location.pathname + '?' + q.toString().replace(/%2C/g, ','));
}
map.on('moveend', syncUrl);

// ---- keyboard shortcuts (ignored while typing)
addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, help = document.getElementById('keys');
  if (k === '/') { e.preventDefault(); document.getElementById('q').focus(); }
  else if (k === 'Escape') { help.style.display = 'none'; if (replay) exitReplay(); else if (document.getElementById('apt').style.display === 'block') FT.closeAirport(); else select(null); }
  else if (k === 't' || k === 'T') { const c = document.getElementById('trails'); c.checked = !c.checked; dirty = true; }
  else if ((k === 'f' || k === 'F') && document.getElementById('follow')) { const c = document.getElementById('follow'); c.checked = !c.checked; c.parentNode.classList.toggle('on', c.checked); }
  else if (k === 'r' || k === 'R') replay ? exitReplay() : enterReplay();
  else if (k === ' ' && replay) { e.preventDefault(); togglePlay(); }
  else if (k === '?') help.style.display = help.style.display === 'block' ? 'none' : 'block';
});

// ---- replay: this device records a compact snapshot of every poll (IndexedDB, last 3 h) and can scrub back through it
const KEEP = 3 * 3600, SPEEDS = [10, 30, 60, 120];
let snaps = [], db = null;
const idb = new Promise(res => {
  try {
    const r = indexedDB.open('br-replay', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('snaps', {keyPath: 't'});
    r.onsuccess = () => res(r.result); r.onerror = () => res(null);
  } catch (e) { res(null); }
});
idb.then(d => {
  db = d; if (!db) return;
  const tx = db.transaction('snaps', 'readwrite'), st = tx.objectStore('snaps'), cut = Date.now() / 1000 - KEEP;
  st.delete(IDBKeyRange.upperBound(cut));
  st.getAll(IDBKeyRange.lowerBound(cut)).onsuccess = e => { snaps = e.target.result.concat(snaps).sort((a, b) => a.t - b.t); };
});
function record(j) {
  if (!j || !Array.isArray(j.ac)) return;
  const t = Math.round(j.now), r5 = x => Math.round(x * 1e4) / 1e4;
  if (snaps.length && t - snaps[snaps.length - 1].t < 10) return;
  // [hex, callsign, lat, lon, alt, track, gs, ground, type, category]
  const s = {t, ac: j.ac.filter(d => Number.isFinite(d.lat)).map(d => [d.hex, d.flight || '', r5(d.lat), r5(d.lon), d.alt ?? null, d.track ?? 0, d.gs ?? 0, d.ground ? 1 : 0, d.type || '', d.category || ''])};
  snaps.push(s);
  while (snaps.length && snaps[0].t < t - KEEP) snaps.shift();
  if (db) try { const st = db.transaction('snaps', 'readwrite').objectStore('snaps'); st.put(s); st.delete(IDBKeyRange.upperBound(t - KEEP)); } catch (e) {}
}
const lerp = (a, b, f) => a + (b - a) * f;
const lerpDeg = (a, b, f) => a + ((((b - a) % 360) + 540) % 360 - 180) * f;
function frameAt(t) {   // planes at time t: interpolate between the two snapshots around t (no jump over gaps > 2 min)
  let i = snaps.findIndex(s => s.t > t); if (i < 0) i = snaps.length;
  const A = snaps[i - 1], B = snaps[i], out = new Map();
  if (!A) return out;
  const bm = B && B.t - A.t < 120 ? new Map(B.ac.map(a => [a[0], a])) : null, f = bm ? (t - A.t) / (B.t - A.t) : 0;
  for (const a of A.ac) {
    const b = bm && bm.get(a[0]), g = b ? f : 0, q = b || a;
    const d = {hex: a[0], flight: a[1], lat: lerp(a[2], q[2], g), lon: lerp(a[3], q[3], g), alt: a[4] == null ? null : lerp(a[4], q[4] ?? a[4], g),
      track: lerpDeg(a[5], q[5], g), gs: a[6], ground: !!a[7], type: a[8], category: a[9], ts: t};
    const pts = [];
    for (let k = Math.max(0, i - 20); k < i; k++) { const r = snaps[k].ac.find(x => x[0] === a[0]); if (r) pts.push([r[2], r[3], r[7] ? null : r[4]]); }
    out.set(a[0], {d, pts, col: altColor(d.alt, d.ground)});
  }
  return out;
}
function drawLabels(m) {
  ctx.font = '500 11px "JetBrains Mono",monospace'; ctx.lineWidth = 3; ctx.strokeStyle = '#020406'; ctx.fillStyle = '#c4e7ff';
  for (const p of m.values()) if (p.vis && p.d.flight) { ctx.strokeText(p.d.flight, p.x + 12, p.y + 4); ctx.fillText(p.d.flight, p.x + 12, p.y + 4); }
}
const rp = document.getElementById('rp'), rpPos = document.getElementById('rpPos');
const fmtT = t => new Date(t * 1000).toLocaleTimeString('en-IN', {timeZone: 'Asia/Kolkata', hour12: false});
function rpRange() { return [snaps[0].t, snaps[snaps.length - 1].t]; }
function setReplayT(t) {
  const [a, b] = rpRange(); replay.t = Math.min(Math.max(t, a), b);
  view = frameAt(replay.t); dirty = true;
  rpPos.value = Math.round((replay.t - a) / Math.max(b - a, 1) * 1000);
  document.getElementById('rpT').textContent = fmtT(replay.t) + ' IST';
}
function enterReplay() {
  if (snaps.length < 2) { const b = document.querySelector('#bReplay span'); b.textContent = 'Recording…'; setTimeout(() => b.textContent = 'Replay', 2000); return; }
  select(null); replay = {t: 0, playing: false, speed: 30};
  rp.style.display = 'flex'; document.getElementById('bReplay').classList.add('on'); 
  const [a, b] = rpRange(); setReplayT(Math.max(a, b - 1800));   // start 30 min back
  togglePlay();
}
function exitReplay() {
  if (!replay) return;
  replay = null; view = planes; rp.style.display = 'none'; document.getElementById('bReplay').classList.remove('on');  dirty = true;
}
function togglePlay() { replay.playing = !replay.playing; document.getElementById('rpPlay').textContent = replay.playing ? '❚❚' : '▶'; }
let rpLast = 0;
(function tick(ts) {
  requestAnimationFrame(tick);
  if (replay && replay.playing) {
    const dt = rpLast ? Math.min((ts - rpLast) / 1000, .25) : 0;
    setReplayT(replay.t + dt * replay.speed);
    if (replay.t >= rpRange()[1]) togglePlay();
  }
  rpLast = ts;
})(0);
document.getElementById('bSrc').onclick = e => { document.body.classList.toggle('show-src'); e.currentTarget.classList.toggle('on'); };
document.getElementById('bReplay').onclick = () => replay ? exitReplay() : enterReplay();
document.getElementById('rpPlay').onclick = togglePlay;
document.getElementById('rpLive').onclick = exitReplay;
document.getElementById('rpSpd').onclick = e => { replay.speed = SPEEDS[(SPEEDS.indexOf(replay.speed) + 1) % SPEEDS.length]; e.target.textContent = '×' + replay.speed; };
rpPos.oninput = () => { const [a, b] = rpRange(); setReplayT(a + (b - a) * rpPos.value / 1000); };
window.__first.then(j => poll(j));   // data was requested before Leaflet even loaded
setInterval(poll, POLL);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
requestAnimationFrame(frame);
});
</script>
</body>
